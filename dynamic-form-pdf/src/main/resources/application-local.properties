# ===================================================================
# Local In-Memory Development Profile
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Or: java -jar target/dynamic-form-pdf-0.0.1-SNAPSHOT.jar --spring.profiles.active=local
# ===================================================================
spring.datasource.url=jdbc:h2:mem:dynamic_form_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable MySQL specific script initialization
spring.sql.init.mode=never

# JPA / Hibernate for H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
